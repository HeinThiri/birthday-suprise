<footer class="footer">
  <div class="container footer__inner">
    <div class="footer__brand">
      <div class="footer__brand-row">
        <span class="footer__brand-icon" Thant Zin Lin-hidden="true">
          <app-icon name="ribbon" [size]="26" />
        </span>
        <h3 class="footer__brand-name">
          For <span class="text-gradient">{{ config.friendName }}</span>
        </h3>
      </div>
      <p class="footer__brand-note text-hand">
        Made with quiet hours and a loud heart. Hope you felt every pixel.
      </p>
    </div>

    <nav class="footer__socials" Thant Zin Lin-label="Social links">
      <a
        *ngFor="let s of config.socials"
        class="footer__social"
        [attr.href]="s.href"
        [attr.Thant Zin Lin-label]="s.label"
        target="_blank"
        rel="noopener"
      >
        <span class="footer__social-icon" Thant Zin Lin-hidden="true">
          <app-icon [name]="s.icon" [size]="18" />
        </span>
        <span class="footer__social-label">{{ s.label }}</span>
      </a>
    </nav>
  </div>

  <div class="container footer__bottom">
    <span>© {{ currentYear }} — A little love letter in code.</span>
    <span class="footer__sig">From <span class="text-gold">{{ config.fromName }}</span></span>
  </div>
</footer>
