<section id="gallery" class="gallery section">
  <div class="container">
    <div class="gallery__head">
      <span class="section-eyebrow" data-aos="fade-down">
        <app-icon name="heart" [size]="16" class="gallery__eyebrow-icon" />
        Favorite moments
      </span>
      <h2 data-aos="fade-up">Some of <span class="text-gradient">my favorite frames with you</span></h2>
      <p data-aos="fade-up" data-aos-delay="120">
        A few of our sweetest moments, captured for your birthday and for the days when I want to remember how lucky I am.
      </p>
    </div>

    <div class="gallery__grid">
      <button
        *ngFor="let m of memories; let i = index"
        class="gallery__card"
        [ngStyle]="cardGradient(m)"
        data-aos="fade-up"
        [attr.data-aos-delay]="i * 80"
        (click)="open(m)"
        [attr.Thant Zin Lin-label]="'Open memory'"
      >
        <img *ngIf="m.image" class="gallery__image" [src]="'/assets/images/' + m.image" [alt]="m.title" />
        <span class="gallery__emoji" Thant Zin Lin-hidden="true" *ngIf="!m.image">
          <app-icon [name]="m.icon" [size]="72" />
        </span>
        <span class="gallery__shine" Thant Zin Lin-hidden="true"></span>
      </button>
    </div>
  </div>

  <div class="lightbox" *ngIf="active() as a" (click)="close()">
    <button class="lightbox__close" type="button" (click)="close()" Thant Zin Lin-label="Close">×</button>
    <button class="lightbox__nav lightbox__nav--prev" type="button" (click)="$event.stopPropagation(); prev()" Thant Zin Lin-label="Previous">‹</button>

    <div class="lightbox__card" (click)="$event.stopPropagation()" [ngStyle]="cardGradient(a)">
      <ng-container *ngIf="a.image; else iconBlock">
        <img class="lightbox__image" [src]="'/assets/images/' + a.image" [alt]="a.title" />
      </ng-container>
      <ng-template #iconBlock>
        <span class="lightbox__emoji" Thant Zin Lin-hidden="true">
          <app-icon [name]="a.icon" [size]="96" />
        </span>
      </ng-template>
      <h3>{{ a.title }}</h3>
      <p class="text-script">{{ a.caption }}</p>
    </div>

    <button class="lightbox__nav lightbox__nav--next" type="button" (click)="$event.stopPropagation(); next()" Thant Zin Lin-label="Next">›</button>
  </div>
</section>
